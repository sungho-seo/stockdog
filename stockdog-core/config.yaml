# StockDog Configuration

# Obsidian vault file paths (resolved via Docker volume: ../skyler → /notes)
vault:
  influencers_file: "/notes/_system/influencers.md"
  watchlist_file: "/notes/_system/watchlist.md"

# Output settings
obsidian:
  # Docker volume: ../skyler → /notes
  # Structure: base_dir/YYYY-MM-DD/{Market_Report_US, Market_Report_KR, Raw_Twitter, media/}
  base_dir: "/notes/raw/stockdog/daily-market"
  date_format: "%Y-%m-%d"

# KR market page (국장/KR garden) config.
# k7: the 대형주 basket (시총 상위 7, curated/static) rendered as a 7-card grid
# on /kr. NOT "실시간 시총 상위" — a named, hand-maintained basket. Order is
# preserved as-is in the snapshot (NOT sorted by change%).
kr:
  k7:
    - { code: "005930", name: "삼성전자" }
    - { code: "000660", name: "SK하이닉스" }
    - { code: "373220", name: "LG에너지솔루션" }
    - { code: "207940", name: "삼성바이오로직스" }
    - { code: "005380", name: "현대차" }
    - { code: "000270", name: "기아" }
    - { code: "068270", name: "셀트리온" }

# Twitter influencer scraping (GetXAPI)
# Set enabled: false to skip get_influencer_tweets() entirely.
# Pipeline will still produce reports without twitter signal.
twitter:
  enabled: false

# 13F institutional holdings (yfinance)
# Set enabled: false to skip get_all_13f_data() entirely.
# Cache files under cache/13f_cache.json are preserved regardless.
f13:
  enabled: false
