# StockDog Configuration

# Obsidian vault file paths (resolved via Docker volume: ../skyler → /notes)
vault:
  influencers_file: "/notes/_system/influencers.md"
  watchlist_file: "/notes/_system/watchlist.md"

# Settings for output formatting
obsidian:
  # In Docker, this maps to the volume defined in docker-compose.yml
  # Structure: base_dir/YYYY-MM-DD/{Market_Report, Raw_Twitter, media/}
  base_dir: "/notes/daily-market"
  date_format: "%Y-%m-%d"
