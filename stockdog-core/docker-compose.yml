version: '3.8'

services:
  stockdog:
    build: .
    container_name: stockdog_core
    # Do not restart automatically, because we will run this as a daily cron job
    restart: "no" 
    env_file:
      - ../.env
    volumes:
      # Map the config file so you can update influencers without rebuilding the container
      - ./config.yaml:/app/config.yaml
      - ./cache:/app/cache

      # VERY IMPORTANT: Volume mapping for the Obsidian Markdown files.
      # Left side (Host): ~/service/skyler (sibling repo, cloned separately from stockdog)
      # Right side (Container): /notes (matches config.yaml base_dir prefix)
      - ../../skyler:/notes
